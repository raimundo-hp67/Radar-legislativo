services:
  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      # Si el 5432 está ocupado, define POSTGRES_PORT=5433 en .env
      # (y ajusta el puerto en DATABASE_URL del mismo .env).
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      # postgres:18 declara VOLUME /var/lib/postgresql (PGDATA vive en
      # /var/lib/postgresql/18/docker): montar el directorio padre es lo
      # correcto en esta versión — no cambiar a .../data (layout pre-18).
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
