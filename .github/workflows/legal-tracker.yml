name: Legal Tracker Weekly
on:
  # Manual fallback only. Production schedule is handled by Vercel cron
  # (/api/cron/legal-poll) to avoid duplicate Slack notifications.
  workflow_dispatch:
    # Allow manual triggering from the GitHub Actions UI
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger reason
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Reason: ${{ github.event.inputs.reason }}"
          fi

      - name: Trigger Legal Tracker Poll
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/legal/poll" \
            -H "x-api-key: ${{ secrets.LEGAL_POLL_API_KEY }}" \
            -H "Content-Type: application/json")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response code: $http_code"
          echo "Response body: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "Poll failed with status $http_code"
            exit 1
          fi
          
          # Parse and display summary
          echo ""
          echo "=== Poll Summary ==="
          echo "$body" | jq -r '"Total projects: \(.total)"'
          echo "$body" | jq -r '"Successfully polled: \(.polled)"'
          echo "$body" | jq -r '"Projects with changes: \(.withChanges)"'
          
          errors=$(echo "$body" | jq -r '.errors | length')
          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "=== Errors ==="
            echo "$body" | jq -r '.errors[]'
          fi

      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Legal tracker poll completed successfully"
          else
            echo "Legal tracker poll failed"
          fi
